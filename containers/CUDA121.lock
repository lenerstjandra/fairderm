FROM nvidia/cuda:12.1.1-cudnn8-devel-ubuntu22.04
ENV PYTHONUNBUFFERED=1
RUN apt-get update && apt-get install -y python3.11 python3-pip git && rm -rf /var/lib/apt/lists/*
WORKDIR /opt/fairderm
COPY . /opt/fairderm
RUN python3.11 -m pip install --upgrade pip==24.2 && python3.11 -m pip install -r requirements.txt && python3.11 -m pip install -e .
